# Cuts a release when a semver tag is pushed.
#
# Publishes @evpanda/sdk to npm, then cuts the matching GitHub Release.
#
# To release:
#   1. bump "version" in package.json, and merge it
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# The tag is the trigger, so the version in the tree and the version in the
# tag cannot drift — validate-tag fails the release if they disagree. npm
# rejects re-publishing an existing version, so a bump is not optional.
#
# Prerequisites (one-time, no secrets):
#   - npm trusted publishing: on npmjs.com, add a trusted publisher for
#     @evpanda/sdk pointing at repo `evpanda-labs/evpanda-node`, workflow
#     `release.yml`, no environment, action `npm publish`.
#
# Publishing uses OIDC (id-token: write) — no API token to store or rotate.
# npm also attaches provenance, a supply-chain attestation, which the same
# permission covers.
#
# The four jobs are the same four in all three EVPanda SDKs:
#   validate-tag → checks → publish → github-release
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is a valid version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a release version (want vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi

      - name: Check the tag matches the version in the tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::package.json is $version but the tag is $TAG — bump one of them"
            exit 1
          fi
          echo "package.json ($version) matches $TAG"

      - name: Check the tag is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "::error::$TAG is not an ancestor of master — release from master only"
            exit 1
          fi

  # The same gate a pull request clears, re-run against the tagged commit.
  checks:
    needs: validate-tag
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish to npm
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and no runner ships
      # one that new with Node 22. Installing it explicitly also means the
      # publish does not silently change behaviour the day a runner image
      # bumps its bundled npm.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm install --no-audit --no-fund

      # No NODE_AUTH_TOKEN: npm authenticates over OIDC against the trusted
      # publisher configured for this package — same model as the Python
      # SDK's PyPI publish. There is no token to expire, which is exactly
      # what broke the first attempt at this release.
      #
      # prepublishOnly (build) runs automatically before publish.
      - name: Publish
        run: npm publish --provenance --access public

  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pre-1.0 and pre-release tags are marked as such so consumers are
          # not told an unstable version is the latest stable one.
          flags=(--generate-notes --title "$TAG")
          case "$TAG" in
            v0.*|*-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}"
